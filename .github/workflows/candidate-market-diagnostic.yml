name: Candidate market full-period diagnostic
on:
  push:
    branches: [release/v1.0-development]
    paths:
      - scripts/diagnose_candidate_market.py
      - .github/workflows/candidate-market-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/diagnose_candidate_market.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-market-full-period-diagnostic
          path: candidate-market-output/
          retention-days: 90
