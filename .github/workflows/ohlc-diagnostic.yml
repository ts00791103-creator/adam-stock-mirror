name: Read-only OHLC diagnostic
on:
  push:
    branches: [release/v1.0-development]
    paths: ['scripts/diagnose_6148.py', '.github/workflows/ohlc-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/diagnose_6148.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw-6148-ohlc-evidence
          path: diagnostics/
