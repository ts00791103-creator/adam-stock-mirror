name: Adam V1.0 live Taiwan quotes
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market-data dependencies
        run: python -m pip install yfinance pandas numpy
      - name: Download and validate real Taiwan daily quotes
        run: python scripts/live_tw_quotes_smoke.py
