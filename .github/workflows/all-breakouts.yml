name: Read-only all Taiwan breakout scan
on:
  workflow_dispatch:
  push:
    branches: [release/v1.0-development]
    paths:
      - scripts/scan_all_breakouts.py
      - .github/workflows/all-breakouts.yml
permissions:
  contents: read
concurrency:
  group: read-only-all-taiwan-breakouts
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts/scan_all_breakouts.py
      - name: Read-only all company scan
        run: python -u scripts/scan_all_breakouts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-taiwan-breakout-report
          path: reports/all-breakouts/
          if-no-files-found: warn
          retention-days: 30
