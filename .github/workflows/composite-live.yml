name: Read-only composite live acceptance
on:
  push:
    branches: [release/v1.0-development]
    paths: ['scripts/live_composite_smoke.py', '.github/workflows/composite-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/live_composite_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composite-two-stock-acceptance
          path: diagnostics/
