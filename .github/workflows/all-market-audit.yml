name: Read-only all listed and OTC stock audit
on:
  push:
    branches: [release/v1.0-development]
    paths:
      - scripts/audit_all_stocks.py
      - .github/workflows/all-market-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6ef07921465a9b4f50a2dce8c4c71935ef10b6be
          path: production-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit_all_stocks.py snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: all-market-universe
          path: audit-output/universe.json
          retention-days: 90
  audit:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6ef07921465a9b4f50a2dce8c4c71935ef10b6be
          path: production-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: all-market-universe
          path: audit-output
      - run: python scripts/audit_all_stocks.py audit --shard ${{ matrix.shard }} --count 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-market-shard-${{ matrix.shard }}
          path: audit-output/shard-*.jsonl
          retention-days: 90
  aggregate:
    needs: [snapshot, audit]
    if: always() && needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6ef07921465a9b4f50a2dce8c4c71935ef10b6be
          path: production-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: all-market-*
          merge-multiple: true
          path: audit-output
      - run: python scripts/audit_all_stocks.py aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-market-final-report
          path: audit-output
          retention-days: 90
