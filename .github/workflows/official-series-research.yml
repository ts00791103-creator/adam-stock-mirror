name: Official complete-series research (read only)
on:
  push:
    branches: [release/v1.0-development]
    paths: [official_series.py, tests/test_official_series.py, tests/fixtures/official-series/**, scripts/probe_official_series.py, .github/workflows/official-series-research.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-series-research
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_official_series.py -v
  known-months:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -u scripts/probe_official_series.py gaps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-known-months
          path: official-series-output/
          retention-days: 90
  complete-series:
    needs: known-months
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: ['3105.TWO', '2330.TW']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -u scripts/probe_official_series.py acquire --symbol ${{ matrix.symbol }} --first 2016-11 --last 2019-12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-series-${{ matrix.symbol }}-checkpoint-1
          path: official-series-output/
          retention-days: 90
      - run: python -u scripts/probe_official_series.py acquire --symbol ${{ matrix.symbol }} --first 2020-01 --last 2023-12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-series-${{ matrix.symbol }}-checkpoint-2
          path: official-series-output/
          retention-days: 90
      - run: python -u scripts/probe_official_series.py acquire --symbol ${{ matrix.symbol }} --first 2024-01 --last 2026-11
      - run: python -u scripts/probe_official_series.py finalize --symbol ${{ matrix.symbol }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-series-${{ matrix.symbol }}-final
          path: official-series-output/
          retention-days: 90
