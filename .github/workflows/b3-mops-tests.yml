name: B3 MOPS EPS regression tests
on:
  push:
    branches: [b3-speed-test]
    paths:
      - 'mops_history.py'
      - 'filing_dates.py'
      - 'official_filing_candidates.py'
      - 'app.py'
      - 'tests/test_mops_history.py'
      - 'tests/test_filing_dates.py'
      - 'tests/test_official_filing_candidates.py'
      - '.github/workflows/b3-mops-tests.yml'
  workflow_dispatch:
jobs:
  mops-eps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pandas requests
      - name: Check Python syntax
        run: python -m compileall -q app.py mops_history.py filing_dates.py official_filing_candidates.py tests
      - name: Run all offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
