name: B3 Pro 程式語法檢查
on:
  push:
    branches: [main, b3-speed-test]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/python-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 檢查 Python 語法
        run: python -m py_compile app.py
