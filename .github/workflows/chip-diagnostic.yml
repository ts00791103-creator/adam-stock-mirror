name: Read-only chip source diagnostic
on:
  push:
    branches: [release/v1.0-development]
    paths: ['scripts/probe_chip_sources.py', '.github/workflows/chip-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python scripts/probe_chip_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-chip-schema
          path: diagnostics/
