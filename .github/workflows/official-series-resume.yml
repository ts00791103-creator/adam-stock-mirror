name: Official OTC series resume (read only)
on:
  push:
    branches: [release/v1.0-development]
    paths: [.github/workflows/official-series-resume.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_official_series.py -v
      - uses: actions/download-artifact@v4
        with:
          name: official-series-3105.TWO-final
          run-id: 42463452416
          github-token: ${{ github.token }}
          path: official-series-output
      - name: Resume only missing months with original cache validation
        run: python -u scripts/probe_official_series.py acquire --symbol 3105.TWO --first 2016-11 --last 2026-11
      - run: python -u scripts/probe_official_series.py finalize --symbol 3105.TWO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-series-3105.TWO-resumed
          path: official-series-output/
          retention-days: 90
